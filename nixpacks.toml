# Nixpacks configuration for Railway deployment
# WeasyPrint requires system libraries for PDF generation

[phases.setup]
# Include all WeasyPrint dependencies via Nix packages
nixPkgs = [
    "python3",
    "gcc",
    "pango",
    "glib",
    "fontconfig", 
    "harfbuzz",
    "freetype",
    "gdk-pixbuf",
    "cairo",
    "gobject-introspection",
    "shared-mime-info"
]

[phases.install]
dependsOn = ["setup"]
cmds = [
    "python -m venv --copies /opt/venv",
    ". /opt/venv/bin/activate && pip install -r requirements.txt"
]

[phases.build]
dependsOn = ["install"]
cmds = [
    ". /opt/venv/bin/activate && python manage.py collectstatic --noinput"
]

[start]
cmd = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120"
