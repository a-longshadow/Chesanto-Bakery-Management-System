{% extends "reports/base_reports.html" %}

{% block title %}{{ page_title }} - Chesanto Bakery{% endblock %}

{% block page_header %}
<div class="page-header">
    <h1 class="page-header__title">{{ page_title }}</h1>
</div>
{% endblock %}

{% block reports_content %}
<div class="coming-soon">
    <div class="coming-soon__icon">🚧</div>
    <h2 class="coming-soon__title">Coming Soon</h2>
    <p class="coming-soon__desc">
        The <strong>{{ page_title }}</strong> is currently under development.
    </p>
    <a href="{% url 'reports:dashboard' %}" class="btn btn--primary">
        ← Back to Dashboard
    </a>
</div>

<style>
    .coming-soon {
        text-align: center;
        padding: 4rem 2rem;
        background: white;
        border-radius: 0.5rem;
        border: 1px solid #e5e7eb;
    }
    
    .coming-soon__icon {
        font-size: 4rem;
        margin-bottom: 1rem;
    }
    
    .coming-soon__title {
        font-size: 1.5rem;
        font-weight: 600;
        color: #111827;
        margin: 0 0 0.5rem 0;
    }
    
    .coming-soon__desc {
        color: #6b7280;
        margin: 0 0 1.5rem 0;
    }
    
    .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.625rem 1.25rem;
        border-radius: 0.375rem;
        font-weight: 500;
        text-decoration: none;
        font-size: 0.875rem;
        transition: all 0.2s;
    }
    
    .btn--primary {
        background: #0d9488;
        color: white;
    }
    
    .btn--primary:hover {
        background: #0f766e;
    }
</style>
{% endblock %}
